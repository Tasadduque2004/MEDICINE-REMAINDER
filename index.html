<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawa Sahayak Pro</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💊</text></svg>">
<style>
:root{--bg:#f6f8ff;--card:#fff;--text:#0f172a;--muted:#5b6478;--line:#e3e8f5;--p:#2874f0;--p2:#1259c7;--y:#ffe500;--g:#10b981;--shadow:0 10px 30px rgba(40,116,240,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151c33;--text:#f1f5f9;--muted:#a3aec7;--line:#26304f;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:17px;padding-top:env(safe-area-inset-top,0px)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center}
.logo b{color:var(--p)}
.links{display:flex;gap:26px;align-items:center;font-weight:600;color:var(--muted)}
.links a:hover{color:var(--p)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:700;background:var(--p);color:#fff;box-shadow:0 8px 20px rgba(40,116,240,.35);transition:.2s;border:0;cursor:pointer;font-size:17px}
.btn:hover{background:var(--p2);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.sm{padding:9px 20px;font-size:15px}
.hero{background:radial-gradient(900px 500px at 85% -10%,rgba(255,229,0,.35),transparent),linear-gradient(135deg,#1259c7,#2874f0 55%,#5b9bff);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:80px 0 90px}
.tag{display:inline-block;background:rgba(255,255,255,.18);padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;margin-bottom:18px}
h1{font-size:clamp(34px,5.2vw,60px);line-height:1.15;font-weight:800;margin-bottom:18px}
h1 span{color:var(--y)}
.hero p.lead{font-size:clamp(17px,2vw,21px);opacity:.95;max-width:560px;margin-bottom:30px}
.hero .btn{background:var(--y);color:#1a1a1a;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:30px;margin-top:36px;flex-wrap:wrap}
.stats div b{display:block;font-size:26px;color:var(--y)}
.stats div span{font-size:14px;opacity:.9}
.phone{width:min(300px,100%);margin-inline:auto;background:#0f172a;border-radius:38px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.4);transform:rotate(3deg)}
.screen{background:#f1f3f6;border-radius:28px;padding:16px;color:#212121;min-height:430px}
.screen h4{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between}
.pill{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:5px solid var(--p)}
.pill.c{border-color:#ef4444}.pill.g{border-color:var(--g)}
.pill b{display:block;font-size:14px}.pill small{color:#6b7280;font-size:12px}
.pill i{float:right;font-style:normal;background:var(--g);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.alarm{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;font-size:14px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
section{padding:80px 0}
.head{text-align:center;max-width:680px;margin:0 auto 48px}
.head h2{font-size:clamp(28px,4vw,42px);line-height:1.2;margin-bottom:10px}
.head p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);transition:.25s}
.card:hover{transform:translateY(-6px)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#dbeafe,#fef9c3);margin-bottom:16px}
.card h3{font-size:20px;margin-bottom:6px}.card p{color:var(--muted);font-size:16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
.step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px 26px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-20px;left:24px;width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}
.step h3{margin-bottom:6px}.step p{color:var(--muted)}
.alt{background:linear-gradient(180deg,transparent,rgba(40,116,240,.07),transparent)}
.langs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.langs span{background:var(--card);border:1px solid var(--line);padding:12px 24px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:var(--shadow)}
.final{background:linear-gradient(135deg,#1259c7,#2874f0);color:#fff;border-radius:32px;text-align:center;padding:60px 24px}
.final h2{font-size:clamp(26px,4vw,40px);margin-bottom:10px}.final p{opacity:.92;margin-bottom:26px}
.final .btn{background:var(--y);color:#1a1a1a}
footer{padding:36px 0 50px;text-align:center;color:var(--muted);font-size:15px}
@media(max-width:900px){
.hero .wrap{grid-template-columns:1fr;padding:50px 0 60px;text-align:center}
.hero p.lead{margin-inline:auto}.cta,.stats{justify-content:center}
.phone{transform:none;margin-top:10px}
.grid,.steps{grid-template-columns:1fr 1fr}
.links a.hide{display:none}
}
@media(max-width:600px){
body{font-size:16px}.wrap{width:calc(100% - 32px)}
.grid,.steps{grid-template-columns:1fr}
section{padding:56px 0}.links{gap:12px}
.btn{width:100%;justify-content:center}.btn.sm{width:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lsel{font:inherit;font-weight:700;font-size:15px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;max-width:130px}
@media(max-width:600px){.logo span{font-size:17px}.lsel{padding:7px 8px;font-size:14px;max-width:96px}.btn.sm{padding:8px 14px;font-size:14px}.links{gap:8px}}
</style>
</head>
